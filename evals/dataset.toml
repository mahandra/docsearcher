# DocQA evaluation set.
#
# [[documents]]: the corpus. `source` is a Markdown file in corpus/, rendered to `format`
# (pdf or docx) and uploaded under `name` — so the eval goes through the real ingestion.
#
# [[cases]]: one question each.
# - evidence: exact quotes from the documents that answer the question. A retrieved chunk
#   is relevant if it contains a quote (whitespace and case are ignored). Quotes, unlike
#   chunk ids, survive re-chunking, so different chunk sizes can be compared.
# - facts: what a correct answer must say (checked by the LLM judge).
# - answerable = false: the documents do not answer it; the right reply says so.
# - history: earlier user questions (follow-ups); only `question` is searched.
#
# Categories: paraphrase, exact (codes, numbers, clause ids), cross_lingual,
# multi_hop (evidence from several places), unanswerable, follow_up.

[[documents]]
key = "agreement"
source = "services_agreement.md"
name = "Northwind - Bluefin Services Agreement.pdf"
format = "pdf"

[[documents]]
key = "api"
source = "tracking_api.md"
name = "Bluefin Tracking API v2.pdf"
format = "pdf"

[[documents]]
key = "handbook"
source = "employee_handbook.md"
name = "Положение о персонале.docx"
format = "docx"

[[documents]]
key = "security"
source = "security_policy.md"
name = "Политика информационной безопасности.docx"
format = "docx"

# --- Services agreement (EN) -----------------------------------------------------------

[[cases]]
id = "agr-payment-terms"
category = "paraphrase"
question = "How long does the customer have to pay an invoice?"
evidence = [{ doc = "agreement", text = "Invoices are payable within thirty (30) days of the invoice date" }]
facts = ["Invoices are payable within 30 days of the invoice date."]

[[cases]]
id = "agr-late-interest"
category = "paraphrase"
question = "What happens if Bluefin pays late?"
evidence = [{ doc = "agreement", text = "interest on the overdue amount at a rate of 1.5% per month" }]
facts = ["The provider may charge interest of 1.5% per month on overdue undisputed amounts."]

[[cases]]
id = "agr-clause-4-2-1"
category = "exact"
question = "What does clause 4.2.1 say?"
evidence = [{ doc = "agreement", text = "4.2.1 commits a material breach of this Agreement" }]
facts = [
    "A party may terminate immediately if the other commits a material breach.",
    "A remediable breach must remain unremedied for 30 days after written notice.",
]

[[cases]]
id = "agr-sla-credit"
category = "exact"
question = "What service credit applies if monthly availability drops to 98.5%?"
evidence = [{ doc = "agreement", text = "If availability falls below 99.0%, the Service Credit is 15% of the monthly fee" }]
facts = ["The service credit is 15% of the monthly fee."]

[[cases]]
id = "agr-liability-cap"
category = "paraphrase"
question = "Is there a limit on how much either side can be held liable for?"
evidence = [{ doc = "agreement", text = "limited to an amount equal to the fees paid and payable by the Customer in the twelve (12) months" }]
facts = ["Liability per contract year is capped at the fees paid and payable in the preceding 12 months."]

[[cases]]
id = "agr-sev1"
category = "paraphrase"
question = "How fast must the provider react when the whole platform is down?"
evidence = [{ doc = "agreement", text = "the Provider responds within one (1) hour" }]
facts = ["The provider responds within one hour, 24/7 (Severity 1)."]

[[cases]]
id = "agr-confidentiality"
category = "paraphrase"
question = "For how long after the contract ends must confidential information be kept secret?"
evidence = [{ doc = "agreement", text = "continue for five (5) years after the termination of this Agreement" }]
facts = ["Five years after termination.", "Trade secrets stay protected as long as they remain trade secrets."]

[[cases]]
id = "agr-renewal"
category = "paraphrase"
question = "Does the services agreement renew automatically, and how can renewal be avoided?"
evidence = [
    { doc = "agreement", text = "renews automatically for successive renewal periods of twelve (12) months" },
    { doc = "agreement", text = "at least ninety (90) days before the end of the then-current term" },
]
facts = ["It renews automatically for 12-month periods.", "Notice of non-renewal must be given at least 90 days before the term ends."]

[[cases]]
id = "agr-data-export"
category = "paraphrase"
question = "Can the customer get its data back after the agreement ends?"
evidence = [{ doc = "agreement", text = "available for export in CSV and JSON formats for a period of forty-five (45) days" }]
facts = ["Data can be exported in CSV and JSON for 45 days after termination."]

[[cases]]
id = "agr-price-increase"
category = "exact"
question = "By how much can Northwind raise its fees each year?"
evidence = [{ doc = "agreement", text = "Any single increase shall not exceed 5% of the fees" }]
facts = ["At most 5%, once per calendar year, with at least 60 days written notice."]

[[cases]]
id = "agr-ru-termination"
category = "cross_lingual"
question = "За сколько дней нужно предупредить о расторжении договора на оказание услуг без особых причин?"
evidence = [{ doc = "agreement", text = "terminate this Agreement for convenience by giving the other party at least sixty (60) days written notice" }]
facts = ["Не менее чем за 60 дней письменно.", "В первоначальный срок клиент всё равно платит абонентскую плату до его конца."]

[[cases]]
id = "agr-ru-data-location"
category = "cross_lingual"
question = "Где хранятся данные клиента по договору с Northwind?"
evidence = [{ doc = "agreement", text = "hosted in data centres located in Frankfurt, Germany" }]
facts = ["Во Франкфурте (Германия); за пределы ЕЭЗ без согласия клиента не передаются."]

[[cases]]
id = "agr-ru-breach"
category = "cross_lingual"
question = "В какой срок Northwind должна сообщить клиенту об утечке персональных данных?"
evidence = [{ doc = "agreement", text = "in any event within seventy-two (72) hours" }]
facts = ["Без неоправданной задержки и в любом случае в течение 72 часов."]

# --- Tracking API (EN) -----------------------------------------------------------------

[[cases]]
id = "api-rate-limit"
category = "paraphrase"
question = "How many calls can I make to the tracking API per minute?"
evidence = [{ doc = "api", text = "600 requests per minute per API key" }]
facts = ["600 requests per minute per API key.", "Batch endpoints count as ten requests."]

[[cases]]
id = "api-e4291"
category = "exact"
question = "What does error E-4291 mean and what should the client do?"
evidence = [{ doc = "api", text = "responds with HTTP status 429 and error code E-4291" }]
facts = ["The rate limit was exceeded.", "Wait for the Retry-After seconds and back off exponentially."]

[[cases]]
id = "api-e4041"
category = "exact"
question = "Why would I get E-4041?"
evidence = [{ doc = "api", text = "E-4041: the tracking number does not exist or belongs to another partner" }]
facts = ["The tracking number does not exist or belongs to another partner."]

[[cases]]
id = "api-webhook-retries"
category = "paraphrase"
question = "What happens if our webhook endpoint is down?"
evidence = [{ doc = "api", text = "retried up to eight times with exponential backoff" }]
facts = ["Delivery is retried up to 8 times with exponential backoff starting after one minute.", "Webhooks failing for three consecutive days are disabled."]

[[cases]]
id = "api-signature"
category = "paraphrase"
question = "How can I check that a webhook call really comes from Bluefin?"
evidence = [{ doc = "api", text = "HMAC-SHA256 signature of the raw request body" }]
facts = ["Verify the HMAC-SHA256 signature in X-Bluefin-Signature using the webhook secret.", "Reject requests whose timestamp is older than five minutes."]

[[cases]]
id = "api-parcel-weight"
category = "exact"
question = "What is the maximum weight of a parcel?"
evidence = [{ doc = "api", text = "Each parcel may weigh at most 31.5 kg" }]
facts = ["31.5 kg per parcel."]

[[cases]]
id = "api-duplicates"
category = "paraphrase"
question = "How do I avoid creating the same shipment twice when I retry a request?"
evidence = [{ doc = "api", text = "clients should send an Idempotency-Key header with a unique value" }]
facts = ["Send an Idempotency-Key header; repeats within 24 hours return the original response."]

[[cases]]
id = "api-key-expiry"
category = "paraphrase"
question = "Do API keys expire?"
evidence = [{ doc = "api", text = "API keys expire after 365 days" }]
facts = ["Keys expire after 365 days; a reminder is sent 30 days before."]

[[cases]]
id = "api-ru-retention"
category = "cross_lingual"
question = "Сколько хранятся данные об отправлениях в Tracking API?"
evidence = [
    { doc = "api", text = "retained for 90 days after delivery" },
    { doc = "api", text = "Proof-of-delivery images, such as photos and signatures, are kept for 30 days after delivery" },
]
facts = ["90 дней после доставки, затем персональные данные обезличиваются.", "Фото и подписи о вручении хранятся 30 дней."]

[[cases]]
id = "api-ru-pagination"
category = "cross_lingual"
question = "Какой максимальный размер страницы при получении списка отправлений?"
evidence = [{ doc = "api", text = "the default is 50 and the maximum is 200" }]
facts = ["Максимум 200, по умолчанию 50."]

[[cases]]
id = "api-ru-cancel"
category = "cross_lingual"
question = "Можно ли отменить отправление, если посылку уже забрали?"
evidence = [{ doc = "api", text = "Once the parcels have been picked up, a cancellation is no longer possible" }]
facts = ["Нет, отмена возможна только в статусе CREATED; нужно оформить возврат."]

