[project]
name = "docqa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2.0",
    "celery[redis]>=5.6.3",
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "langfuse>=5.0.4",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.54.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-django>=4.14.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "ASYNC"]
