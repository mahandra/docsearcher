{% extends "base.html" %}
{% block title %}Sign up · DocQA{% endblock %}
{% block content %}
<section class="auth">
  <h1>Sign up</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</section>
{% endblock %}
