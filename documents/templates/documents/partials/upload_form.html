<form id="upload-form" class="upload"
      hx-post="{% url 'documents:document_upload' %}" hx-encoding="multipart/form-data"
      hx-target="this" hx-swap="outerHTML" hx-disabled-elt="find button">
  <input type="file" name="file" accept=".pdf,.docx" required>
  <button type="submit">
    Upload <span class="htmx-indicator">…</span>
  </button>
  {% for error in form.file.errors %}<p class="warn">{{ error }}</p>{% endfor %}
</form>
